# One Argo CD Application per tenant overlay, generated automatically.
# Adding a folder under apps/tenant-app/overlays/ onboards a new tenant app.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Shobhin15/multitenant-platform.git
        revision: main
        directories:
          - path: apps/tenant-app/overlays/*
  template:
    metadata:
      name: "tenant-app-{{ .path.basename }}"
      labels:
        platform.example.io/tenant: "{{ .path.basename }}"
    spec:
      project: tenants
      source:
        repoURL: https://github.com/Shobhin15/multitenant-platform.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "tenant-{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Terraform owns the namespace (quota, network policy, RBAC).
          - CreateNamespace=false
