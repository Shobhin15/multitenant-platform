apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace is created by Terraform (terraform/modules/tenant), not here.
namespace: tenant-acme

resources:
  - ../../base

labels:
  - pairs:
      platform.example.io/tenant: acme
    includeSelectors: false

patches:
  # Premium tier: more headroom to scale.
  - target:
      kind: HorizontalPodAutoscaler
      name: tenant-app
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: Deployment
      name: tenant-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/1
        value: -text=hello from tenant acme
  - target:
      kind: Ingress
      name: tenant-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: acme.localtest.me
