apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace is created by Terraform (terraform/modules/tenant), not here.
namespace: tenant-globex

resources:
  - ../../base

labels:
  - pairs:
      platform.example.io/tenant: globex
    includeSelectors: false

patches:
  - target:
      kind: Deployment
      name: tenant-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/1
        value: -text=hello from tenant globex
  - target:
      kind: Ingress
      name: tenant-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: globex.localtest.me
