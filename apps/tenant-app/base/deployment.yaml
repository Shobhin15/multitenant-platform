apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-app
    spec:
      serviceAccountName: tenant-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tenant-app
      containers:
        - name: app
          # Placeholder service. Stage 2 replaces this with the Go status API.
          image: hashicorp/http-echo:1.0
          args:
            - -listen=:8080
            - -text=hello from the platform
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
