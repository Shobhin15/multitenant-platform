name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format
        run: terraform fmt -check -recursive terraform
      - name: Validate
        working-directory: terraform/envs/local
        run: |
          terraform init -backend=false
          terraform validate

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize and kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kustomize kubeconform /usr/local/bin/
      - name: Build and validate every tenant overlay
        run: |
          for o in apps/tenant-app/overlays/*; do
            echo "== $o"
            kustomize build "$o" | kubeconform -strict -summary -kubernetes-version 1.30.0 -
          done
      - name: Validate Argo CD manifests against CRD schemas
        run: |
          kubeconform -strict -summary \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            argocd/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.56.2
          trivy --version
      - name: Trivy config scan (Terraform and Kubernetes misconfigurations)
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .
